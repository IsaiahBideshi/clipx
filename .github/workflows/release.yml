name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: resolve
    runs-on: windows-latest
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for an existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $tag = $env:TAG
          $lookup = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq .id 2>&1
          if ($LASTEXITCODE -eq 0) {
            $released = $true
            Write-Host "$tag is already released, so this push doesn't rebuild it."
          } elseif ("$lookup" -match "HTTP 404") {
            $released = $false
          } else {
            throw "Couldn't check whether $tag is already released: $lookup"
          }

          "released=$($released.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Setup Node.js
        if: steps.existing.outputs.released != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.existing.outputs.released != 'true'
        run: npm ci

      - name: Build app
        if: steps.existing.outputs.released != 'true'
        run: npm run build

      - name: Extract release notes
        if: steps.existing.outputs.released != 'true'
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve.outputs.tag }}"
          $changelogPath = "CHANGELOG.md"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          if (-not (Test-Path $changelogPath)) {
            throw "CHANGELOG.md is required to create release notes for $tag."
          }

          $lines = Get-Content $changelogPath
          $targetHeadingPattern = "^##\s+$([regex]::Escape($tag))\s*$"
          $nextHeadingPattern = "^##\s+"
          $startIndex = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $targetHeadingPattern) {
              $startIndex = $i
              break
            }
          }

          if ($startIndex -lt 0) {
            throw "CHANGELOG.md must include a '## $tag' section before releasing $tag."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $nextHeadingPattern) {
              $endIndex = $i
              break
            }
          }

          $sectionLines = [System.Collections.Generic.List[string]]::new()
          for ($i = $startIndex + 1; $i -lt $endIndex; $i++) {
            [void]$sectionLines.Add($lines[$i])
          }

          $notes = ($sectionLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md section '## $tag' must include release notes."
          }

          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        if: steps.existing.outputs.released != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_notes.outputs.path }}
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
          files: |
            dist/ClipX-Setup.exe
            dist/ClipX-Setup.exe.blockmap
            dist/latest.yml
