name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check main process and API syntax
        shell: pwsh
        run: |
          Get-ChildItem api, api-handlers, electron, scripts -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:react

      - name: Check committed share player is up to date
        shell: pwsh
        run: |
          npm run build:player
          if ($LASTEXITCODE) { exit 1 }
          git diff --exit-code public/clip-player
